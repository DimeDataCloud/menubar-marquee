name: Build release

# Produces the universal, ready-to-run MenuBarMarquee.app that end users
# download. This is the only place a Swift toolchain is needed — nobody
# installing the app requires Xcode.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify both architectures are present
        run: |
          lipo -info build/MenuBarMarquee.app/Contents/MacOS/MenuBarMarquee
          lipo -info build/MenuBarMarquee.app/Contents/MacOS/MenuBarMarquee | grep -q x86_64
          lipo -info build/MenuBarMarquee.app/Contents/MacOS/MenuBarMarquee | grep -q arm64

      - name: Verify the bundle is well formed
        run: |
          test -f build/MenuBarMarquee.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" build/MenuBarMarquee.app/Contents/Info.plist | grep -q true
          codesign --verify --verbose build/MenuBarMarquee.app

      # What the user downloads: the .app plus the install/uninstall scripts,
      # so the whole thing is one zip and one double-click.
      - name: Package
        run: |
          mkdir -p out/MenuBarMarquee
          cp -R build/MenuBarMarquee.app out/MenuBarMarquee/
          cp install.sh uninstall.sh README.md out/MenuBarMarquee/
          chmod +x out/MenuBarMarquee/install.sh out/MenuBarMarquee/uninstall.sh
          cd out
          ditto -c -k --sequesterRsrc --keepParent MenuBarMarquee MenuBarMarquee.zip
          shasum -a 256 MenuBarMarquee.zip > MenuBarMarquee.zip.sha256
          cat MenuBarMarquee.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MenuBarMarquee
          path: |
            out/MenuBarMarquee.zip
            out/MenuBarMarquee.zip.sha256

      # Every green main build refreshes a "latest" release, so there is always
      # a stable download URL even before a version is tagged.
      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            out/MenuBarMarquee.zip out/MenuBarMarquee.zip.sha256 \
            --title "MenuBarMarquee — latest build" \
            --notes "Universal build of \`${GITHUB_SHA:0:7}\`. Unzip, then run \`./install.sh\`. No Xcode required."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/MenuBarMarquee.zip
            out/MenuBarMarquee.zip.sha256
