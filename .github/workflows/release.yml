name: Build release

# Produces the universal MenuBarMarquee.app that end users download, so nobody
# needs Xcode on their own machine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify both architectures are present
        run: lipo -info build/MenuBarMarquee.app/Contents/MacOS/MenuBarMarquee

      - name: Zip
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent MenuBarMarquee.app MenuBarMarquee.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MenuBarMarquee
          path: build/MenuBarMarquee.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/MenuBarMarquee.zip
